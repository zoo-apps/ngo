name: Deploy

# zoo.ngo is served from the Sites plane: universe infra/aws/routes/sites.yaml
# routes the host to the staticFiles middleware `zoo-ngo-static`, root
# s3://hanzo-sites/zoo/ngo — org `zoo`, slug `ngo`. It is NOT GitHub Pages any
# more. Pages was switched off for this repo in September, so the Pages deploy
# that used to close this file answered 404 on every push from then on and the
# export never left the runner. The prefix was filled by hand instead, and the
# hand copy never carried `videos/`: the hero's film answered 404 on the live
# site while sitting in every build.
#
# The publish is bin/site in hanzoai/ci, through its action, the one every static
# site in the fleet calls. It reads the deploy key from KMS and uploads under a
# prefix-scoped, short-lived grant, so no bucket credential lives here. The KMS
# credential is the run's own GitHub ID token (`id-token: write`), exchanged at
# IAM for the CI application this repository speaks for; nothing is stored. A
# KMS_CLIENT_ID / KMS_CLIENT_SECRET pair, where one is set, is the fallback. It
# publishes once IAM answers this repository's token for org `zoo` and the
# Sites plane holds the project `ngo` there; until then the step fails and says
# which, rather than reading as a publish.
#
# Every pull request builds and checks the export; only main publishes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm, not bun and not npm: the gui runtime is ~60 packages pinned by the
      # overrides block in pnpm-workspace.yaml, and only pnpm reads it.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Not `pnpm install`: a @hanzo bump that moves package.json without the
      # lockfile is the failure this catches, and it has happened twice.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NODE_ENV: production

      # The hero is the film. A publish that leaves it behind is the defect this
      # file exists to stop, so the export is held to carrying it.
      - name: The export carries Blue's film
        run: |
          set -euo pipefail
          for f in out/videos/blue.webm out/videos/blue.mp4 out/videos/blue.jpg; do
            [ -s "$f" ] || { echo "::error::$f is not in the export"; exit 1; }
          done
          grep -q 'src="/videos/blue.webm"' out/index.html || { echo "::error::the page does not name the film"; exit 1; }

      # The export a publish is made from, kept a week, so the bytes on the edge
      # can be read back against the commit that built them.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: out
          retention-days: 7

      - name: Publish zoo.ngo
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: hanzoai/ci/.github/actions/site@v2.1.8
        with:
          slug: ngo
          dir: out
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}

